server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/course_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root@123

# Google OAuth 2.0
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# JWT Signing Secret (kam se kam 32+ characters ka strong string)
app.jwt.secret=change-this-to-a-strong-secret-key-at-least-32-chars-long
app.jwt.expiration-ms=3600000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true